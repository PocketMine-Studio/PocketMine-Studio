plugins {
    id 'com.android.application'
}

android {
    namespace "net.eqozqq.pocketminestudio"
    compileSdk 34

    defaultConfig {
        applicationId "net.eqozqq.pocketminestudio"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (outputFileName != null && outputFileName.endsWith(".apk")) {
                outputFileName = "PocketMine-Studio_${variant.versionName}.apk"
            } else if (outputFileName != null && outputFileName.endsWith(".aab")) {
                outputFileName = "PocketMine-Studio_${variant.versionName}.aab"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE']
        }
    }
}

dependencies {
    implementation 'io.github.Rosemoe.sora-editor:editor:0.23.6'
    implementation 'io.github.Rosemoe.sora-editor:language-textmate:0.23.6'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jsoup:jsoup:1.22.2"
    implementation "org.apache.commons:commons-compress:1.28.0"
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"
    implementation "com.astuetz:pagerslidingtabstrip:1.0.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

}